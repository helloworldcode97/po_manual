<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invoice Generator - CV Nio Utaman</title>
    <style>
      #root:empty::before {
        content: 'Loading application... if this stays for long, JS might be blocked or crashed.';
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: sans-serif;
        color: #666;
      }
    </style>
    <script>
      function reportError(title, detail) {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="padding: 20px; color: red; font-family: sans-serif; border: 2px solid red; margin: 20px;">' +
            '<h1>' + title + '</h1>' +
            '<p>' + detail + '</p>' +
            '<p>URL: ' + window.location.href + '</p>' +
            '<p>Please check the browser console (F12) for more details.</p>' +
            '</div>';
        }
      }

      window.onerror = function(message, source, lineno, colno, error) {
        reportError('Runtime Error Detected', message + ' at ' + source + ':' + lineno + ':' + colno);
      };

      window.addEventListener('unhandledrejection', function(event) {
        reportError('Unhandled Promise Rejection', event.reason);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx" onerror="reportError('Script Load Failure', 'Failed to load the main application script (./src/main.jsx). This could be due to a 404 error, CORS issue, or network failure.')"></script>
  </body>
</html>
